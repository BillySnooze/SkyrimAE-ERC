; Default MCM settings for Elden Ring Combat.
; MCM Helper writes the user's choices to Data/MCM/Settings/EldenRingCombat.ini,
; which ERC.dll reads on load (MCM values override the plugin's own ini).
; Ids keep the MCM Helper type prefix (f/i/b/s).

[Combat]
bDeferDodgeToTKDodge = 1
fRollStaminaCost = 12
fIframeFraction = 0.55
fHitStopSeconds = 0.06
fHitStopScale = 0.15
iDodgeKeyCode = 56
fSprintHoldSeconds = 0.25
bEnableRolls = true
bEnableHitStop = true
bEnableGuardBreak = true
bEnableLockOnRolls = true

[Stagger]
fKnockdownHealthFraction = 0.35

[Movement]
fRollDurationLight = 0.62
fRollDurationMedium = 0.78
fRollDurationHeavy = 1.05
fEquipLoadLightCut = 0.30
fEquipLoadMediumCut = 0.70

[Animations]
sAnimFlinch = HitReaction_Flinch
sAnimStagger = HitReaction_Stagger
sAnimLargeStagger = HitReaction_LargeStagger
sAnimKnockdown = HitReaction_Knockdown
sRollLightFront = ERC_Roll_Light_Front
sRollMediumFront = ERC_Roll_Medium_Front
sRollHeavyFront = ERC_Roll_Heavy_Front
