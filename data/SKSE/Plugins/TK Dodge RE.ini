; ============================================================================
;  TK Dodge RE / NG configuration override, shipped by Elden Ring Combat.
; ----------------------------------------------------------------------------
;  WHY THIS FILE IS IN THE ERC MOD:
;  JOJ's "JOJ - MCM and INI Settings" ships TK Dodge with StepDodge = true,
;  which makes the dodge a STEP dodge instead of a roll. That is why dodging in
;  this list never looked like an ELDEN RING roll: the game was playing
;  TKDodge\StepDodge*.hkx, not the DodgeForward/Back/Left/Right roll clips.
;
;  The ERC mod sits at the top of the MO2 priority list, so this copy wins over
;  the list's copy. Delete this file (or set StepDodge back to true) to return
;  to step dodges. If JOJ ships new TK Dodge settings later, re-copy them here.
;
;  Everything below is JOJ's shipped config with three values changed, each
;  marked "ERC:".
; ============================================================================

[Main]
;EnableDebugLog = false
;Enable Debug Message Printing.

DodgeHotkey = 277
;Map the Hotkey that perform dodge, go to this site to check the corresponding key code: https://www.creationkit.com/index.php?title=Input_Script#DXScanCodes
;ERC: unused while EnableSprintKeyDodge is true - the sprint key becomes the dodge key.

EnableSprintKeyDodge = true
;Set the dodge perform by tapping sprint button, that will replace the dodge hotkey with sprint key.
;Require Classic Sprinting Redone (https://www.nexusmods.com/skyrimspecialedition/mods/20166) to work.
;ERC: JOJ ships this true. Dodge = tap Sprint (Left Alt by default).

StepDodge = false
;Set if perform step dodge instead of rolling dodge, "true" is enable while "false" is disable.
;ERC: was true in JOJ - that is what made the dodge a step. false plays the roll
;     clips (DodgeBack/Left/Right + the vanilla forward roll), which are also
;     what the Dynamic Dodge Animation OAR packs replace.

DodgeStamina = 10
;Set the stamina cost when perform dodge.

EnableSneakDodge = false
;Set if allow perfrom dodge when sneaking.

iFrameDuration = 0.3
;Set the duration of invincibility frames. unit : second(s)

EnableDodgeAttackCancel = true
;allow dodge to cancel attacks

EnableDodgeInPlace = true
;Allows to dodge even if the player isn't moving. Dodge direction determined by "defaultDodgeEvent".
;ERC: JOJ omits this key, which defaults to false, so tapping dodge while
;     standing still did nothing at all. true gives an ELDEN RING style
;     standstill forward roll.

defaultDodgeEvent = TKDodgeForward
;Default dodge event triggered when not moving. Available options: "TKDodgeForward", "TKDodgeLeft", "TKDodgeRight", "TKDodgeBack"
;Leave it blank may cause CTD,use "EndAnimatedCamera" can disable this feature too.
;ERC: was TKDodgeBack (a backstep). Forward matches how ELDEN RING rolls from idle.
